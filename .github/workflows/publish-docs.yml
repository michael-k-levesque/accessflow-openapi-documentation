name: Publish API reference

on:
  push:
    branches: [main]
    paths:
      - "openapi.yaml"
      - "site/**"
      - "examples/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate-build-deploy:
    name: Validate, build, and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate OpenAPI structure and examples
        run: python scripts/validate_examples.py

      - name: Check repository and documentation quality
        run: python scripts/check_repository.py

      - name: Build GitHub Pages artifact
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp openapi.yaml _site/openapi.yaml
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
