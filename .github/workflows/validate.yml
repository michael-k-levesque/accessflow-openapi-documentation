name: Validate documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: OpenAPI and docs quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate OpenAPI structure and examples
        run: python scripts/validate_examples.py

      - name: Check repository and documentation quality
        run: python scripts/check_repository.py

      - name: Lint documentation prose with Vale
        uses: vale-cli/vale-action@v3
        with:
          files: all
          filter_mode: nofilter
          fail_on_error: true
